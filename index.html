<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Horse — Canvas Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b1020; overflow: hidden; }
  body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; }
  #stage { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #controls {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 18px; align-items: center; padding: 10px 18px;
    background: rgba(10, 16, 32, 0.7); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; color: #cdd6f4; font-size: 14px; backdrop-filter: blur(6px);
    user-select: none;
  }
  #controls label { display: flex; gap: 8px; align-items: center; }
  input[type="range"] { width: 130px; accent-color: #89b4fa; }
  .speed-val { width: 4ch; display: inline-block; text-align: right; }
  button {
    background: #89b4fa; color: #0b1020; border: 0; border-radius: 999px;
    padding: 6px 16px; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  button:hover { filter: brightness(1.1); }
  #hint {
    position: absolute; top: 14px; width: 100%; text-align: center;
    color: rgba(205, 214, 244, 0.5); font-size: 13px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="hint">Transverse gallop · 4-beat stride with suspension phase</div>
</div>
<div id="controls">
  <button id="toggle">Pause</button>
  <label>Speed
    <input id="speed" type="range" min="0.3" max="2.5" step="0.05" value="1">
    <span class="speed-val" id="speedVal">1.0×</span>
  </label>
  <label><input id="ghost" type="checkbox" checked> Motion trail</label>
</div>
<script>
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.max(1, W * DPR);
  canvas.height = Math.max(1, H * DPR);
}
window.addEventListener("resize", resize);
resize();

/* ==================================================================== *
 * Gallop gait: transverse gallop, one full stride = phase t in [0,1)
 * Footfall sequence & beat offsets:
 *   LH (non-lead hind) → RH → LF (non-lead fore) → RF (lead fore)
 *   ...then suspension (all feet airborne) from ~0.78 to 1.0
 * ==================================================================== */
const BEATS = [0.00, 0.12, 0.34, 0.46, 0.78]; // LH, RH, LF, RF, suspension end
const STRIDE_TIME = 0.6;                      // seconds per stride at 1×
const STRIDE_SCROLL = 170;                    // px of ground scrolled per stride

/* ==================================================================== *
 * Two-bone IK for legs. Horses: front knees fold backward (knee forward
 * point), hind hocks point forward. We control fold direction via a sign.
 * ==================================================================== */
function solveLeg(rootX, rootY, tx, ty, L1, L2, fold) {
  const dx = tx - rootX, dy = ty - rootY;
  let d = Math.hypot(dx, dy);
  d = Math.max(0.1, Math.min(d, L1 + L2 - 0.4));
  const a = Math.atan2(dy, dx);
  const cosA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
  const alpha = Math.acos(Math.max(-1, Math.min(1, cosA)));
  const a1 = a + alpha * fold;
  return { kx: rootX + Math.cos(a1) * L1, ky: rootY + Math.sin(a1) * L1 };
}

/* ==================================================================== *
 * Hoof target for one leg, in local (horse-facing-right) coordinates.
 * Leg cycle, p in [0,1) from its own beat:
 *   0.00–0.30  swing / protract: hoof arcs forward through the air
 *   0.30–0.62  stance: hoof planted, sweeps backward (relative)
 *   0.62–1.00  breakover & lift
 * ==================================================================== */
function hoofTarget(rootX, rootY, isHind, p) {
  const strideX = isHind ? 46 : 50;
  const standY = isHind ? 56 : 60; // hind roots sit 4 units lower than fore
  const hy = rootY + standY;

  if (p < 0.30) {
    const s = p / 0.30;                       // 0..1 across swing
    const x = rootX - strideX * 0.26 + s * strideX * 0.51;
    const lift = Math.sin(Math.PI * s);
    // folded knee carriage: hoof tucks up then reaches forward
    return { x, y: hy - lift * (isHind ? 30 : 34) - lift * lift * 10 };
  }
  if (p < 0.62) {
    const s = (p - 0.30) / 0.32;              // 0..1 across stance
    const x = rootX + strideX * 0.25 - s * strideX * 0.5;
    return { x, y: hy + Math.sin(Math.PI * s) * 1.5 };
  }
  const s = (p - 0.62) / 0.38;                // 0..1 breakover + early lift
  const x = rootX - strideX * 0.25 + Math.sin(Math.PI * s) * -4;
  return { x, y: hy - Math.sin(Math.PI * s) * 14 };
}

/* Body dynamics: bob, pitch, spine stretch, evaluated at stride phase t */
function bodyPose(t) {
  const bob = Math.sin(t * Math.PI * 2 - 0.9) * 6 + Math.sin(t * Math.PI * 4) * 1.5;
  const pitch = Math.sin(t * Math.PI * 2 + 0.3) * 0.075;
  const stretch = Math.sin(t * Math.PI * 2) * 7;
  return { bob, pitch, stretch };
}

function ell(x, y, rx, ry, angle) {
  ctx.ellipse(x, y, rx, ry, angle, 0, Math.PI * 2);
}

/* ==================================================================== *
 * Draw one horse. Origin is the point on the ground under the horse's
 * center; local units are pre-scale, facing right (+x forward).
 * ==================================================================== */
function drawHorse(px, groundY, t, scale) {
  const { bob, pitch, stretch } = bodyPose(t);
  const ox = -stretch, bx = stretch;   // hind / fore spine end shift

  ctx.save();
  ctx.translate(px, groundY - 64 * scale + bob * scale * 0.25);
  ctx.scale(scale, scale);
  ctx.rotate(pitch);

  // leg definitions — far-side legs drawn first, darker
  const legs = [
    { name: "LH", rx: -42 + ox, ry: 8,  beat: BEATS[0], hind: true,  far: true,  fold: -1 },
    { name: "LF", rx: 44 + bx,  ry: 4,  beat: BEATS[2], hind: false, far: true,  fold: 1  },
    { name: "RH", rx: -38 + ox, ry: 8,  beat: BEATS[1], hind: true,  far: false, fold: -1 },
    { name: "RF", rx: 40 + bx,  ry: 4,  beat: BEATS[3], hind: false, far: false, fold: 1  },
  ];
  const L1 = 32, L2 = 32;

  for (const leg of legs) {
    const p = (t - leg.beat + 1) % 1;
    const h = hoofTarget(leg.rx, leg.ry, leg.hind, p);
    const knee = solveLeg(leg.rx, leg.ry, h.x, h.y, L1, L2, leg.fold);

    ctx.strokeStyle = leg.far ? "#6e4226" : "#8a5433";
    ctx.lineCap = "round";
    ctx.lineWidth = leg.hind ? 7.5 : 6.5;

    // upper bone thicker, lower tapers to hoof
    ctx.lineWidth = leg.hind ? 8 : 7;
    ctx.beginPath(); ctx.moveTo(leg.rx, leg.ry); ctx.lineTo(knee.kx, knee.ky); ctx.stroke();
    ctx.lineWidth = leg.hind ? 4.5 : 4;
    ctx.beginPath(); ctx.moveTo(knee.kx, knee.ky); ctx.lineTo(h.x, h.y); ctx.stroke();

    ctx.fillStyle = "#26262e";
    ctx.beginPath(); ell(h.x, h.y, 3.6, 2.7, 0); ctx.fill();
  }

  /* ---- Body (rump → back → withers → chest → belly) ---- */
  const bodyGrad = ctx.createLinearGradient(0, -30, 0, 26);
  bodyGrad.addColorStop(0, "#ad6c3f");
  bodyGrad.addColorStop(1, "#7c4a2d");
  ctx.fillStyle = bodyGrad;
  ctx.strokeStyle = "#5a341f";
  ctx.lineWidth = 1.6;

  ctx.beginPath();
  ctx.moveTo(-52 + ox, 2);
  ctx.bezierCurveTo(-58 + ox, -20, 6, -30, 32 + bx, -24);
  ctx.bezierCurveTo(50 + bx, -21, 60 + bx, -12, 62 + bx, -2);
  ctx.bezierCurveTo(60 + bx, 14, 28, 25, -8 + (ox + bx) / 2, 23);
  ctx.bezierCurveTo(-36 + ox, 20, -50 + ox, 14, -52 + ox, 2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  /* ---- Neck & head ---- */
  ctx.fillStyle = "#9d6038";
  ctx.beginPath();
  ctx.moveTo(28 + bx, -18);
  ctx.bezierCurveTo(48 + bx, -36, 66 + bx, -42, 77 + bx, -35);
  ctx.lineTo(83 + bx, -22);
  ctx.bezierCurveTo(68 + bx, -12, 50 + bx, -5, 34 + bx, -1);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(73 + bx, -39);
  ctx.lineTo(97 + bx, -32);
  ctx.lineTo(99 + bx, -23);
  ctx.bezierCurveTo(88 + bx, -21, 79 + bx, -22, 73 + bx, -26);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // ear
  ctx.fillStyle = "#7c4a2d";
  ctx.beginPath();
  ctx.moveTo(75 + bx, -38);
  ctx.lineTo(71 + bx, -49);
  ctx.lineTo(80 + bx, -39);
  ctx.closePath();
  ctx.fill();

  // eye
  ctx.fillStyle = "#14141c";
  ctx.beginPath(); ell(83 + bx, -32, 1.9, 1.9, 0); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.65)";
  ctx.beginPath(); ell(83.7 + bx, -32.7, 0.6, 0.6, 0); ctx.fill();

  // muzzle shading
  ctx.fillStyle = "rgba(70,40,22,0.5)";
  ctx.beginPath(); ell(95 + bx, -26, 3.5, 4, 0); ctx.fill();

  /* ---- Mane (flows with stride) ---- */
  ctx.strokeStyle = "#42271400";
  ctx.lineCap = "round";
  const sway = Math.sin(t * Math.PI * 2) * 5;
  ctx.strokeStyle = "#4a2b16";
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(34 + bx, -22);
  ctx.bezierCurveTo(50 + bx, -38 + sway, 62 + bx, -45 + sway, 74 + bx, -38 + sway * 0.4);
  ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(40 + bx, -18);
  ctx.bezierCurveTo(54 + bx, -32 + sway * 0.8, 64 + bx, -38 + sway * 0.8, 72 + bx, -32);
  ctx.stroke();

  /* ---- Tail (lags the stride) ---- */
  const tw = Math.sin(t * Math.PI * 2 + 1.4) * 7;
  ctx.strokeStyle = "#4a2b16";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(-51 + ox, -2);
  ctx.bezierCurveTo(-68 + ox, 0 + tw, -78 + ox, 12 + tw, -86 + ox, 26 + tw * 1.4);
  ctx.stroke();
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(-51 + ox, -4);
  ctx.bezierCurveTo(-66 + ox, -6 + tw * 0.8, -76 + ox, 4 + tw, -82 + ox, 18 + tw * 1.2);
  ctx.stroke();

  ctx.restore();
}

/* ==================================================================== *
 * Scene
 * ==================================================================== */
const groundY = () => H * 0.74;
const horseX = () => W * 0.45;

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#1d2a4d");
  g.addColorStop(0.55, "#3d3f6b");
  g.addColorStop(1, "#8a5a5e");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(W * 0.22, H * 0.18, 0, W * 0.22, H * 0.18, 90);
  glow.addColorStop(0, "rgba(255,215,175,0.85)");
  glow.addColorStop(1, "rgba(255,215,175,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  const gy = groundY();

  // parallax hills
  ctx.fillStyle = "rgba(28,24,52,0.8)";
  ctx.beginPath();
  ctx.moveTo(0, gy);
  for (let i = 0; i <= 24; i++) {
    const x = (i / 24) * W;
    const y = gy - 30 - Math.sin(i * 1.7 + scroll * 0.0008) * 26 - Math.cos(i * 0.9) * 12;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, gy);
  ctx.closePath();
  ctx.fill();

  // ground band
  const gg = ctx.createLinearGradient(0, gy, 0, H);
  gg.addColorStop(0, "#2b2135");
  gg.addColorStop(1, "#15111f");
  ctx.fillStyle = gg;
  ctx.fillRect(0, gy, W, H - gy);

  ctx.strokeStyle = "rgba(210,170,200,0.3)";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, gy + 1); ctx.lineTo(W, gy + 1); ctx.stroke();

  const dash = 70, gap = 46, period = dash + gap;
  const off = -((scroll % period) + period) % period;
  ctx.strokeStyle = "rgba(210,175,205,0.16)";
  for (let x = off; x < W + dash; x += period) {
    ctx.beginPath(); ctx.moveTo(x, gy + 16); ctx.lineTo(x + dash, gy + 16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 18, gy + 34); ctx.lineTo(x + 18 + dash * 0.6, gy + 34); ctx.stroke();
  }
}

// dust puffs kicked up on each footfall beat
const puffs = [];

function checkFootfalls(prevPhase) {
  for (let i = 0; i < 4; i++) {
    const crossed = prevPhase < BEATS[i] && phase >= BEATS[i];
    if (crossed) {
      const hindward = i < 2;
      puffs.push({
        x: horseX() + (hindward ? -30 : 40) + (Math.random() - 0.5) * 14,
        y: groundY() + 4,
        vx: -40 - Math.random() * 40,
        vy: -30 - Math.random() * 30,
        r: 3 + Math.random() * 3,
        life: 1,
      });
    }
  }
}

let prevPhase = 0;
let scroll = 0;
let phase = 0;
let playing = true;
let speed = 1.0;
function updatePuffs(dt) {
  for (const p of puffs) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 40 * dt;
    p.r += 22 * dt;
    p.life -= dt * 1.6;
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    if (puffs[i].life <= 0) puffs.splice(i, 1);
  }
}

function drawPuffs() {
  for (const p of puffs) {
    ctx.fillStyle = `rgba(215,195,220,${(0.22 * p.life).toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ghost trail of recent poses */
const trail = [];
const TRAIL_MAX = 8;

/* ==================================================================== *
 * Main loop
 * ==================================================================== */
let last = performance.now();

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (playing) {
    prevPhase = phase;
    phase = (phase + (dt / STRIDE_TIME) * speed) % 1;
    scroll += STRIDE_SCROLL * (dt / STRIDE_TIME) * speed;
    checkFootfalls(prevPhase);
    updatePuffs(dt);

    trail.push({ phase, delay: 0 });
    while (trail.length > TRAIL_MAX) trail.shift();
    for (const g of trail) g.delay += dt;
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  drawPuffs();

  const gy = groundY();
  const scale = Math.max(0.9, Math.min(1.7, H / 640)) * 1.3;

  if (document.getElementById("ghost").checked) {
    const spacing = (STRIDE_TIME / speed) / TRAIL_MAX;
    for (let i = 0; i < trail.length; i++) {
      const a = ((i + 1) / trail.length) * 0.10;
      const gt = (phase - (TRAIL_MAX - i) * 0.045 + 1) % 1;
      ctx.save();
      ctx.globalAlpha = a;
      drawHorse(horseX() - (TRAIL_MAX - i) * 26, gy, gt, scale);
      ctx.restore();
    }
  }

  drawHorse(horseX(), gy, phase, scale);

  requestAnimationFrame(frame);
}

/* Controls */
document.getElementById("toggle").addEventListener("click", (e) => {
  playing = !playing;
  e.target.textContent = playing ? "Pause" : "Play";
});
const speedEl = document.getElementById("speed");
speedEl.addEventListener("input", () => {
  speed = parseFloat(speedEl.value);
  document.getElementById("speedVal").textContent = speed.toFixed(1) + "×";
});
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    document.getElementById("toggle").click();
  }
});

requestAnimationFrame(frame);
</script>
</body>
</html>
